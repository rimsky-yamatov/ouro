name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm }
          - { name: macos-x86_64,   os: macos-15-intel }
          - { name: macos-arm64,    os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
          - { name: windows-arm64,  os: windows-11-arm }
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOURO_VERSION=0.0.0-ci

      - name: Build
        run: cmake --build build --config Release

      - name: Locate ouroc0
        shell: bash
        run: |
          if [ -f build/Release/ouroc0.exe ]; then
            echo "OUROC=build/Release/ouroc0.exe" >> "$GITHUB_ENV"
          else
            echo "OUROC=build/ouroc0" >> "$GITHUB_ENV"
          fi

      - name: Version
        shell: bash
        run: |
          "$OUROC" --version

      - name: Test
        shell: bash
        run: bash tests/run.sh "$OUROC"

      # ouroc0 is a cross compiler: every host must emit byte-identical output.
      - name: Compile samples and hash them
        shell: bash
        run: |
          mkdir -p out
          for f in tests/cases/*.ou; do
            "$OUROC" < "$f" > "out/$(basename "$f" .ou).elf"
          done
          (cd out && cmake -E sha256sum *.elf) > hashes.txt
          cat hashes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.name }}
          path: hashes.txt

  determinism:
    name: identical output on every host
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          path: hashes

      - name: Compare
        run: |
          ref=hashes/hashes-linux-x86_64/hashes.txt
          status=0
          for f in hashes/*/hashes.txt; do
            if ! diff -u "$ref" "$f"; then
              echo "::error::output of $f differs from linux-x86_64"
              status=1
            fi
          done
          exit $status
